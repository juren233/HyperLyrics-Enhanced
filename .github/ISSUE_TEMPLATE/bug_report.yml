name: 缺陷反馈 (Bug Report)
description: 提交 HyperLyrics Enhanced 在使用过程中遇到的 Bug 反馈 / Submit bug reports for HyperLyrics Enhanced
title: "[BUG] <简短描述您遇到的问题 / Short description of the issue>"
labels: ["bug"]
assignees: ["juren233"]
body:
  - type: markdown
    attributes:
      value: |
        注意：本项目不接受任何移植包、官改包以及修改版 com.android.systemui 或 miui.systemui.plugin 的问题反馈。
        Note: Bug reports from ported ROMs, custom official ROMs, or modified com.android.systemui / miui.systemui.plugin are not accepted.

        ## 如何更快解决问题 / How to get your issue solved faster
        **没有日志的反馈无法定位问题，将被自动标记为「无效」，3 天内未补充会被关闭。请务必先按下面的流程获取 Debug 日志，再提交。**
        Reports without logs cannot be investigated; they are labeled "invalid" automatically and closed if no logs are added within 3 days. Please follow the steps below to get Debug logs before submitting.

        1. 安装 Debug 包（如果当前已经是 Debug 包，无需重复安装）：前往 [Releases](https://github.com/juren233/HyperLyrics-Enhanced/releases) 下载文件名含 `debug` 的 APK 安装，安装后点击主页右上角的刷新按钮，重启一次系统界面与所有音乐 App。
        2. 将日志输出等级改为调试：HyperLyrics Enhanced 设置 →「调试信息」→「日志输出等级」→「调试日志」。
        3. 复现问题：保持上述设置，重新操作一遍出问题的步骤。
        4. 导出全部日志：复现后立即在同一「调试信息」页面点击「导出全部日志」。
        5. 把导出的日志文件拖进下方「日志」一栏上传。

        1. Install the Debug build (no need to reinstall if you are already on one): download the APK whose file name contains `debug` from [Releases](https://github.com/juren233/HyperLyrics-Enhanced/releases). After installing, tap the refresh button at the top right of the home page to restart System UI and all music apps once.
        2. Set the log level to Debug: HyperLyrics Enhanced Settings → "Debug Info" → "Log Level" → "Debug".
        3. Reproduce the problem: keep that setting and repeat the steps that trigger the issue.
        4. Export all logs: right after reproducing, tap "Export All Logs" on the same "Debug Info" page.
        5. Drag the exported log file into the "Logs" field below.

        提交前请先搜索现有 issue，避免重复反馈；描述请写清楚「做了什么、期望什么、实际发生了什么」。
        Please search existing issues first to avoid duplicates, and describe what you did, what you expected, and what actually happened.
  - type: dropdown
    id: system_platform
    attributes:
      label: 系统平台 / System Platform
      options:
        - HyperOS 4
        - HyperOS 3
        - HyperOS 2
        - 其他安卓系统 (Other Android Systems)
    validations:
      required: true
  - type: input
    id: system_version
    attributes:
      label: 系统具体版本号 / Specific System Version
      description: 请填写完整的系统版本号 / Please enter the full system version number
      placeholder: "例如：OS3.0.303.0 / Example: OS3.0.303.0"
    validations:
      required: true
  - type: dropdown
    id: bug_aspect
    attributes:
      label: 问题属于哪一方面 / Which part does the bug relate to?
      options:
        - 歌词显示相关（超级岛与AOD相同问题） (Lyric display related (same issue on HyperIsland and AOD))
        - 超级岛相关 (HyperIsland related)
        - 媒体通知卡片相关 (Media notification card related)
        - 息屏功能相关 (Always-on Display related)
        - Apple Music体验优化功能相关 (Apple Music experience optimization feature related)
        - 通知型灵动岛歌词相关 (Notification-style Dynamic Island lyrics related)
    validations:
      required: true
  - type: dropdown
    id: lyric_source
    attributes:
      label: 歌词源 / Lyric Source
      options:
        - Lyricon
        - SuperLyric
        - LyricInfo
        - 其他（或未使用歌词源） (Other / No source used)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题详细描述 / Detailed Description of the Issue
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to Reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期效果 / Expected Behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: LSPosed 日志或 HyperLyrics Enhanced 日志 / LSPosed Logs or HyperLyrics Enhanced Logs
      description: |
        请上传从 LSPosed 管理器导出的日志文件，或应用内导出的 HyperLyrics Enhanced 日志文件。此处不接受日志截图或日志录屏，截图形式无法定位问题所在；日志请以文件形式提供，或直接粘贴网盘分享链接。
        Please upload the log file exported from LSPosed Manager or HyperLyrics Enhanced. Log screenshots or screen recordings are not accepted because they cannot provide enough information to locate the issue; provide logs as files or paste a cloud-drive sharing link directly.
      placeholder: 拖拽上传文件，或在此直接粘贴网盘分享链接 (Drag & drop files here, or paste cloud drive link directly)
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / 录屏 / 网盘链接 / Screenshots / Screen Recordings / Cloud Drive Links
      description: |
        如果有的话，请上传与问题相关的截图或操作录屏，或者直接粘贴网盘分享链接、屏幕录制分享链接。此处不接受日志类截图或录屏；日志请在上方以文件形式提供。
        If available, please upload screenshots or screen recordings related to the issue, or paste cloud-drive / video-sharing links directly. Log screenshots or recordings are not accepted here; provide logs as files in the field above.
      placeholder: 拖拽上传文件，或在此直接粘贴网盘分享链接 (Drag & drop files here, or paste cloud drive link directly)
