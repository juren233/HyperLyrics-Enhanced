name: 处理 HyperOS 4 Issue

on:
  issues:
    types: [opened, edited]

concurrency:
  group: handle-hyperos4-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  handle-hyperos4-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 拉取代码 Checkout
        uses: actions/checkout@v6

      - name: 添加标签并回复 HyperOS 4 兼容性提示
        uses: actions/github-script@v9
        with:
          script: |
            const handleHyperOs4Issue = require('./.github/scripts/handle-hyperos4-issue.js');
            await handleHyperOs4Issue({ github, context, core });
