name: Android Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码 Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 版本检测 Version Gate
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          while IFS= read -r line; do
            echo "$line" >> "$GITHUB_OUTPUT"
          done < <(bash .github/scripts/resolve-version.sh)

          current_name="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=.*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)"
          current_code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=*[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)"
          commit_message="$(git log -1 --pretty=%B)"

          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "${EVENT_NAME} trigger, proceeding with resolved version"
          elif [[ "$EVENT_NAME" == "push" && "$commit_message" == *"[skip ci]"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "automation restore commit detected, skipping build"
          elif [[ "$current_name" =~ -(beta|canary)$ ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "${BASH_REMATCH[1]} channel commit detected, proceeding"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            previous_name="$(git show HEAD^:app/build.gradle.kts 2>/dev/null | sed -nE 's/^[[:space:]]*versionName[[:space:]]*=.*"([^"]+)".*/\1/p' | head -n1 || true)"
            previous_code="$(git show HEAD^:app/build.gradle.kts 2>/dev/null | sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=*[[:space:]]*([0-9]+).*/\1/p' | head -n1 || true)"

            if [[ "$current_name" != "$previous_name" || "$current_code" != "$previous_code" ]]; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "version changed (Name: $previous_name -> $current_name, Code: $previous_code -> $current_code), proceeding"
            else
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "stable version unchanged (Name: $current_name, Code: $current_code), skipping build"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 JDK Setup Java
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Android SDK Setup Android SDK
        if: steps.gate.outputs.skip != 'true'
        uses: android-actions/setup-android@v4
        with:
          api-level: 34
          build-tools: '34.0.0'

      - name: 配置 Gradle Setup Gradle
        if: steps.gate.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: 授权脚本 Grant Permission
        if: steps.gate.outputs.skip != 'true'
        run: chmod +x gradlew .github/scripts/resolve-version.sh

      - name: 构建 Debug 或 Release Build
        if: steps.gate.outputs.skip != 'true'
        env:
          CHANNEL: ${{ steps.gate.outputs.channel }}
          FULL_NAME: ${{ steps.gate.outputs.full_name }}
        run: |
          set -euo pipefail

          if [[ "$CHANNEL" == "stable" ]]; then
            ./gradlew --no-daemon --max-workers=2 assembleDebug assembleRelease \
              --build-cache -PciVersionName="$FULL_NAME"
          else
            ./gradlew --no-daemon --max-workers=2 assembleDebug \
              --build-cache -PciVersionName="$FULL_NAME"
          fi

      - name: 上传 PR 构建产物 Upload PR Artifacts
        if: github.event_name == 'pull_request' && steps.gate.outputs.skip == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.gate.outputs.channel }}-debug-v${{ steps.gate.outputs.full_name }}-${{ steps.gate.outputs.code }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: 解码签名密钥 Decode Keystore
        if: github.event_name != 'pull_request' && steps.gate.outputs.skip == 'false'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: echo "$SIGNING_KEY" | base64 -d > release.jks

      - name: 签名 Debug APK Sign Debug APK
        if: github.event_name != 'pull_request' && steps.gate.outputs.skip == 'false'
        env:
          STORE_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          CHANNEL: ${{ steps.gate.outputs.channel }}
          V_NAME: ${{ steps.gate.outputs.full_name }}
          V_CODE: ${{ steps.gate.outputs.code }}
        run: |
          set -euo pipefail

          BTDIR="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          ZA="$BTDIR/zipalign"
          AS="$BTDIR/apksigner"

          DEBUG_IN=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*-debug.apk' -print -quit)
          test -n "$DEBUG_IN"

          $ZA -f -v -p 4 "$DEBUG_IN" debug-aligned.apk
          $AS sign \
            --ks release.jks \
            --ks-pass env:STORE_PASS \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASS \
            --out "HyperLyrics Enhanced-debug-v${V_NAME}-${V_CODE}.apk" \
            debug-aligned.apk

          if [[ "$CHANNEL" == "stable" ]]; then
            RELEASE_IN=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
            test -n "$RELEASE_IN"
            $ZA -f -v -p 4 "$RELEASE_IN" release-aligned.apk
            $AS sign \
              --ks release.jks \
              --ks-pass env:STORE_PASS \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASS \
              --out "HyperLyrics Enhanced-release-v${V_NAME}-${V_CODE}.apk" \
              release-aligned.apk
          fi

      - name: 上传 Canary 构建产物 Upload Canary Artifact
        if: github.event_name != 'pull_request' && steps.gate.outputs.skip == 'false' && steps.gate.outputs.channel == 'canary'
        uses: actions/upload-artifact@v7
        with:
          name: canary-debug-v${{ steps.gate.outputs.full_name }}-${{ steps.gate.outputs.code }}
          path: HyperLyrics Enhanced-debug-v${{ steps.gate.outputs.full_name }}-${{ steps.gate.outputs.code }}.apk
          if-no-files-found: error

      - name: 创建 Canary 标签 Create Canary Tag
        if: github.event_name != 'pull_request' && steps.gate.outputs.skip == 'false' && steps.gate.outputs.channel == 'canary'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FULL_TAG: ${{ steps.gate.outputs.full_tag }}
          FULL_NAME: ${{ steps.gate.outputs.full_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git show-ref --verify --quiet "refs/tags/$FULL_TAG"; then
            existing_sha="$(git rev-list -n1 "$FULL_TAG")"
            if [[ "$existing_sha" != "$COMMIT_SHA" ]]; then
              echo "Tag $FULL_TAG already exists at $existing_sha, expected $COMMIT_SHA" >&2
              exit 1
            fi
            echo "Tag $FULL_TAG already points to $COMMIT_SHA; keeping it."
            exit 0
          fi

          git tag -a "$FULL_TAG" "$COMMIT_SHA" \
            -m "Canary ${FULL_NAME}" \
            -m "对应 GitHub Actions：${RUN_URL}"
          git push origin "$FULL_TAG"

      - name: 生成发布说明 Generate Release Body
        if: github.event_name != 'pull_request' && steps.gate.outputs.skip == 'false' && (steps.gate.outputs.channel == 'stable' || steps.gate.outputs.channel == 'beta')
        id: release_body
        run: |
          set -euo pipefail

          PREV_TAG="${{ steps.gate.outputs.prev_stable_tag }}"
          CHANNEL="${{ steps.gate.outputs.channel }}"
          BODY_DELIMITER="release_body_$(git rev-parse HEAD)"
          echo "body<<$BODY_DELIMITER" >> "$GITHUB_OUTPUT"
          .github/scripts/generate-release-body.sh "$PREV_TAG" HEAD "$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "$BODY_DELIMITER" >> "$GITHUB_OUTPUT"

      - name: 创建正式版发布 Create Stable Release
        if: github.event_name != 'pull_request' && steps.gate.outputs.skip == 'false' && steps.gate.outputs.channel == 'stable'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.gate.outputs.full_name }}
          name: v${{ steps.gate.outputs.full_name }}
          body: ${{ steps.release_body.outputs.body }}
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            HyperLyrics Enhanced-debug-v${{ steps.gate.outputs.full_name }}-${{ steps.gate.outputs.code }}.apk
            HyperLyrics Enhanced-release-v${{ steps.gate.outputs.full_name }}-${{ steps.gate.outputs.code }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建 Beta Pre-release
        if: github.event_name != 'pull_request' && steps.gate.outputs.skip == 'false' && steps.gate.outputs.channel == 'beta'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.gate.outputs.full_name }}
          name: v${{ steps.gate.outputs.full_name }}
          body: ${{ steps.release_body.outputs.body }}
          draft: false
          prerelease: true
          generate_release_notes: false
          files: HyperLyrics Enhanced-debug-v${{ steps.gate.outputs.full_name }}-${{ steps.gate.outputs.code }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 同步 LSPosed 仓库资料 Sync LSPosed Metadata
        if: github.event_name != 'pull_request' && steps.gate.outputs.skip == 'false' && steps.gate.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ secrets.LSP_REPO_TOKEN }}
          LSP_REPO: Xposed-Modules-Repo/com.juren233.hyperlyricsenhanced
        run: |
          set -euo pipefail

          LSP_CHECKOUT="$RUNNER_TEMP/lsp-repository"
          gh auth setup-git
          gh repo clone "$LSP_REPO" "$LSP_CHECKOUT"

          mkdir -p "$LSP_CHECKOUT/assets"
          cp README.md "$LSP_CHECKOUT/README.md"
          cp LICENSE "$LSP_CHECKOUT/LICENSE"
          cp assets/hyperlyrics-app-icon-rounded.png \
            "$LSP_CHECKOUT/assets/hyperlyrics-app-icon-rounded.png"

          git -C "$LSP_CHECKOUT" config user.name "github-actions[bot]"
          git -C "$LSP_CHECKOUT" config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$LSP_CHECKOUT" add \
            README.md LICENSE assets/hyperlyrics-app-icon-rounded.png

          if ! git -C "$LSP_CHECKOUT" diff --cached --quiet; then
            git -C "$LSP_CHECKOUT" commit \
              -m "chore: 同步上游展示资料" \
              -m "- 更新 README、开源协议与应用图标"
            git -C "$LSP_CHECKOUT" push origin HEAD:main
          fi

      - name: 发布到 LSPosed 仓库 Publish LSPosed Release
        if: github.event_name != 'pull_request' && steps.gate.outputs.skip == 'false' && steps.gate.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ secrets.LSP_REPO_TOKEN }}
          LSP_REPO: Xposed-Modules-Repo/com.juren233.hyperlyricsenhanced
          RELEASE_BODY: ${{ steps.release_body.outputs.body }}
        run: |
          set -euo pipefail

          V_NAME="${{ steps.gate.outputs.full_name }}"
          V_CODE="${{ steps.gate.outputs.code }}"
          TARGET_TAG="${V_CODE}-${V_NAME// /_}"
          RELEASE_APK="HyperLyrics Enhanced-release-v${V_NAME}-${V_CODE}.apk"
          LSP_BODY="$RUNNER_TEMP/lsp-release-body.md"

          test -f "$RELEASE_APK"
          printf '%s\n' "$RELEASE_BODY" \
            | sed '1{/^## 最新提交$/d;}' > "$LSP_BODY"

          if gh release view "$TARGET_TAG" --repo "$LSP_REPO" >/dev/null 2>&1; then
            echo "LSPosed release $TARGET_TAG already exists; skipping."
            exit 0
          fi

          gh release create "$TARGET_TAG" "$RELEASE_APK" \
            --repo "$LSP_REPO" \
            --target main \
            --title "$V_NAME" \
            --notes-file "$LSP_BODY"
